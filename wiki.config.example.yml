# wiki.config.example.yml — example config for a new course.
# bootstrap.sh auto-generates wiki.config.yml in the vault, but you can also
# fill this file in and keep it as a reference.

course: "Causal Inference"          # course name (= {{COURSE}})
vault: "Causality-wiki"             # vault folder name (= {{VAULT}})
source_dirs: "../../course_files_export/"   # immutable source path (= {{SOURCE_DIRS}})
source_types: "lecture slides · transcripts · handwritten notes · cleaned-up notes"   # source forms (= {{SOURCE_TYPES}})
unit: "lecture"                     # chapter | week | lecture | module | paper (= {{UNIT}})
keep_english_terms: "on"            # keep technical terms as their original English (= {{KEEP_ENGLISH_TERMS}})
math: "on"                          # LaTeX math module (= {{MATH}})

# Example bootstrap call:
#   ./bootstrap.sh -c "Causal Inference" -v ../class/causality/wiki/Causality-wiki \
#                  -s "../../course_files_export/" -u lecture -m on -e on \
#                  -t "lecture slides · transcripts · handwritten notes · cleaned-up notes"
